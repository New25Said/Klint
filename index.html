<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klint - Discord Bot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      padding: 3rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 420px;
      width: 100%;
      border: 1px solid #334155;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .status {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background-color: #10b981;
      color: #064e3b;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: bold;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background-color: #5865F2;
      color: white;
      padding: 0.9rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .btn:hover {
      background-color: #4752C4;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Klint</h1>
    <div class="status">● Sistema Operativo</div>
    <p>Un usuario más en tu servidor de Discord. Charlas informales, respuestas inteligentes y presencia activa.</p>
    <a class="btn" href="https://discord.com/oauth2/authorize?client_id=1535688886326530198&permissions=8&integration_type=0&scope=bot+applications.commands" target="_blank">Añadir a Discord</a>
  </div>
</body>
</html>
